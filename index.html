<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123d25">
<title>CHECK OUT BD | Safe Food</title>
<style>
:root{--g:#123d25;--g2:#28683d;--gold:#d7ad38;--cream:#fbfaf3;--ink:#26372b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.65}
.wrap{width:min(1120px,92%);margin:auto}.top{background:#0d2f1d;color:#eaf2e8;padding:8px 0;font-size:13px}.top .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
header{position:sticky;top:0;z-index:5;background:#fffdf5ed;backdrop-filter:blur(10px);border-bottom:1px solid #e9e6d8}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:78px;gap:16px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:58px;height:58px;object-fit:contain}.brand b{display:block;color:var(--g);font-size:20px;letter-spacing:1px}.brand small{font-size:10px;color:#68766b;letter-spacing:1px}
nav{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:bold}a{color:inherit;text-decoration:none}nav a:hover{color:var(--g2)}
.btn{display:inline-block;border:0;border-radius:30px;background:var(--g2);color:white;padding:12px 22px;font-weight:bold;cursor:pointer}.btn:hover{background:var(--g);transform:translateY(-1px)}
.hero{padding:65px 0;background:radial-gradient(ellipse at 80% 15%,#e8f1d9,transparent 42%),linear-gradient(120deg,#fffdf6,#eff5e8)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:35px}.eyebrow{display:inline-block;background:#e7f0df;color:#47733e;padding:6px 13px;border-radius:30px;font-size:12px;font-weight:bold;letter-spacing:1px}
h1{font: bold clamp(36px,5vw,59px)/1.1 Georgia,serif;color:var(--g);margin:18px 0}h1 em{color:#a47a17;font-style:normal}.hero p{font-size:17px;color:#617064;max-width:560px}.hero-logo{text-align:center}.hero-logo img{width:min(100%,350px);filter:drop-shadow(0 15px 22px #173c201b)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.outline{background:transparent;color:var(--g);border:1px solid #b9c9b6}
section{padding:68px 0}.head{text-align:center;max-width:700px;margin:0 auto 32px}.kicker{font-size:11px;font-weight:bold;letter-spacing:2px;color:#997b26}.head h2{font: bold clamp(29px,4vw,41px) Georgia,serif;color:var(--g);margin:8px 0}.head p{color:#6b786d;margin:0}
.mission{background:white}.mission-img{overflow:hidden;border-radius:20px;border:1px solid #e5e7d8;box-shadow:0 15px 40px #183d2012}.mission-img img{width:100%;display:block;height:auto}
.products{background:#f3f6ed}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:900px;margin:auto}.card{background:white;border:1px solid #e3e9dc;border-radius:18px;padding:25px;box-shadow:0 10px 28px #183d200c;position:relative}.card:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--g2),var(--gold));border-radius:18px 18px 0 0}
.tag{display:inline-block;background:#edf4e8;color:#3c713c;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:bold}.card h3{font: bold 24px Georgia,serif;color:var(--g);margin:14px 0 2px}.zone{color:#7b877b;font-size:13px;margin:0 0 16px}
.size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.size-btn{border:1px solid #dce6d7;background:#fbfcf8;color:var(--g);border-radius:12px;padding:12px 5px;cursor:pointer;min-width:0}.size-btn b{display:block;font-size:16px}.size-btn span{font-size:12px;color:#3c7544}.size-btn:hover,.size-btn.selected{border-color:var(--g2);background:#eaf3e5;box-shadow:0 0 0 2px #28683d18}
.choose-hint{font-size:12px;color:#778477;margin:12px 0 0}
.order{background:#fff}.panel{max-width:760px;margin:auto;background:#fbfcf8;border:1px solid #e4eade;border-radius:20px;padding:clamp(19px,4vw,34px);box-shadow:0 12px 35px #183d200c}
.summary{background:#edf4e8;border:1px solid #dce8d4;padding:14px;border-radius:12px;margin-bottom:18px;color:#294b30}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d8e0d4;border-radius:9px;background:white;font:inherit;color:#26372b}textarea{min-height:85px;resize:vertical}
.total{margin:18px 0;background:var(--g);color:white;border-radius:12px;padding:14px 17px;display:flex;justify-content:space-between;align-items:center}.total strong{color:#f3d778;font-size:23px}
.submit{width:100%;font-size:16px;padding:14px}.hint{text-align:center;color:#788477;font-size:12px}
.contact{background:#f0f4e9;text-align:center}.contact-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
footer{background:#0d2f1d;color:#e7efe4;text-align:center;padding:25px}footer b{letter-spacing:2px}footer small{display:block;color:#c1d0c0}
@media(max-width:740px){.hero-grid{grid-template-columns:1fr;text-align:center}.hero p{margin:auto}.hero-logo img{width:220px}.actions{justify-content:center}.cards{grid-template-columns:1fr}nav{gap:12px;font-size:12px}}
@media(max-width:480px){nav a:not(.nav-cta){display:none}.brand img{width:50px;height:50px}.brand b{font-size:17px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.size-btn{padding:10px 2px}}
</style>
</head>
