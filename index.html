<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check oUt — We Value Our Customers Like Family</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <meta property="og:title" content="Check oUt — We Value Our Customers Like Family" />
  <meta property="og:description" content="ফ্রেশ রেডি-টু-কুক চিংড়ি ও বিশ্বস্ত পণ্য — সরাসরি অর্ডার করুন।" />
  <meta property="og:image" content="https://checkoutbd.github.io/checkOut-/logo.png" />
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #1e293b; padding-bottom: 40px; }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #15803d;
    }
    .brand-title { font-size: 18px; font-weight: bold; color: #14532d; margin: 0; }
    .brand-sub { font-size: 11px; color: #64748b; margin: 2px 0 0; }
    .go-order-btn {
      background: #dc2626;
      color: #fff;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .container { max-width: 720px; margin: 16px auto; padding: 0 12px; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .prod-name { font-weight: bold; font-size: 15px; margin: 0 0 4px; }
    .prod-price { color: #dc2626; font-weight: bold; font-size: 14px; }
    .btn {
      background: #15803d;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .order-now-btn {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="logo.png" alt="Check oUt Logo" onerror="this.style.display='none'" />
        <div>
          <p class="brand-title">Check oUt</p>
          <p class="brand-sub">We Value Our Customers Like Family</p>
        </div>
      </a>
      <a class="go-order-btn" href="order.html">অর্ডার পেজ (<span id="cartCount">0</span>)</a>
    </div>
  </header>

  <div class="container">
    <!-- উদাহরণ প্রোডাক্ট কার্ড — নিজের পণ্য অনুযায়ী নাম ও দাম বদলে নেবেন -->
    <div class="card">
      <div>
        <p class="prod-name">বাগদা চিংড়ি (রেডি-টু-কুক)</p>
        <div class="prod-price">৳850 / কেজি</div>
      </div>
      <div>
        <button class="btn" onclick="addToCart('বাগদা চিংড়ি', 850)">কার্টে নিন</button>
        <button class="order-now-btn" onclick="orderDirect('বাগদা চিংড়ি', 850)">অর্ডার</button>
      </div>
    </div>

    <div class="card">
      <div>
        <p class="prod-name">ছাটি / গলদা চিংড়ি</p>
        <div class="prod-price">৳950 / কেজি</div>
      </div>
      <div>
        <button class="btn" onclick="addToCart('ছাটি / গলদা চিংড়ি', 950)">কার্টে নিন</button>
        <button class="order-now-btn" onclick="orderDirect('ছাটি / গলদা চিংড়ি', 950)">অর্ডার</button>
      </div>
    </div>
  </div>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem("checkout_cart") || "[]");
    }
    function saveCart(cart) {
      localStorage.setItem("checkout_cart", JSON.stringify(cart));
      updateCount();
    }
    function updateCount() {
      const totalQty = getCart().reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCount").textContent = totalQty;
    }
    function addToCart(name, price) {
      const cart = getCart();
      const found = cart.find(i => i.name === name);
      if (found) found.qty += 1;
      else cart.push({ name, price, qty: 1 });
      saveCart(cart);
    }
    function orderDirect(name, price) {
      saveCart([{ name, price, qty: 1 }]);
      window.location.href = "order.html";
    }
    updateCount();
  </script>
</body>
</html>
